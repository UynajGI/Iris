# Development-only changelog generator. No automatic version bump or publication.
[changelog]
header = """
# Changelog

Generated from Conventional Commits by git-cliff. Installation instructions and
known limitations are maintained separately in [release notes](docs/releases/).

"""
body = """
{% if commits | length > 0 %}
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/UynajGI/Iris/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^(build|ci|test|chore)", group = "Development" },
  { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
sort_commits = "oldest"
