version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories: [/, /apps/shell/src-tauri, /components/raw-decoder]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: [/, /apps/shell]
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
