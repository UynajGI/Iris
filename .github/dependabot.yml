version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      maintenance-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directories: [/, /apps/shell/src-tauri, /components/raw-decoder]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      maintenance-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        exclude-patterns: [ort, nalgebra, base64, tower-http]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directories: [/, /apps/shell]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      maintenance-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      maintenance-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
