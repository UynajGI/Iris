name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_dinov3:
        description: 'Download the pinned public DINOv3 conversion under the Meta license and run real inference'
        type: boolean
        required: false
        default: false
      verify_directml_fallback:
        description: 'Provision pinned DirectML runtime and validate CPU fallback without requiring a hosted GPU'
        type: boolean
        required: false
        default: false
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source boundaries and documentation links
        run: python tools/check-public-tree.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo +stable-x86_64-pc-windows-msvc fmt --all -- --check
      - name: Test workspace
        run: cargo +stable-x86_64-pc-windows-msvc test --workspace
      - name: Verify bundled model hashes
        run: python tools/setup-models.py
      - name: Exercise all bundled ONNX models
        run: cargo +stable-x86_64-pc-windows-msvc test -p iris-core bundled_onnx_tensor_smoke -- --ignored --nocapture
      - name: Exercise persistent model worker
        run: cargo +stable-x86_64-pc-windows-msvc test -p iris-daemon --test worker actual_models_run_in_persistent_daemon_child -- --ignored --nocapture
      - name: Test native updater protocol and host lifecycle
        run: cargo +stable-x86_64-pc-windows-msvc test --manifest-path apps/shell/src-tauri/Cargo.toml --features updater-client --lib
      - name: Test native host with real daemon
        run: |
          $env:IRIS_TEST_DAEMON = (Resolve-Path target/debug/iris-daemon.exe).Path
          cargo +stable-x86_64-pc-windows-msvc test --manifest-path apps/shell/src-tauri/Cargo.toml --features updater-client --lib real_daemon_update_pause_and_failed_install_recovery -- --ignored
      - name: Test Python tools (including DINOv3 packaging and SCRFD geometry; no weight downloads)
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Check API schema
        run: cargo +stable-x86_64-pc-windows-msvc run -p iris-daemon -- --openapi > openapi.json
  local-media:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # MINGW64 is deliberate: the runtime dependency allowlist targets MSVCRT.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make
      - name: Expose the selected MinGW toolchain to PowerShell
        shell: msys2 {0}
        run: cygpath -w "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Build HEIC runtime from hash-pinned source archives
        run: python tools/setup-heif-runtime.py --jobs 2
      - name: Test image decoding, orientation, cache migration and corrupt inputs
        run: cargo +stable-x86_64-pc-windows-msvc test -p iris-core --test media -- --include-ignored
      - name: Test background HEIC scanning and HTTP media responses
        run: cargo +stable-x86_64-pc-windows-msvc test -p iris-daemon --test media -- --include-ignored
      - name: Provision standalone RAW runtime and licensed native compatibility corpus
        run: |
          python tools/setup-raw-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare-public-corpus.py --native-only
      - name: Test RAW preview, rawler fallback and paired RAW-JPEG operations
        run: |
          cargo +stable-x86_64-pc-windows-msvc build --release --locked --manifest-path components/raw-decoder/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:IRIS_RAW_DECODER_PATH = (Resolve-Path components/raw-decoder/target/release/iris-raw-decoder.exe).Path
          cargo +stable-x86_64-pc-windows-msvc test -p iris-core --test raw -- --ignored
      - name: Verify explicitly requested DirectML fallback paths (no GPU claim)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_directml_fallback
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/setup-models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/setup-directml-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable-x86_64-pc-windows-msvc build --release -p iris-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify-directml.py --fallback-only --photos crates/iris-core/tests/fixtures/media --count 1 --output artifacts/ci-directml-fallback
      # Optional weights are never fetched on push/PR. SCRFD research weights
      # are not provisioned by this workflow, even on manual runs.
      - name: Provision explicitly requested DINOv3 artifact
        if: github.event_name == 'workflow_dispatch' && inputs.verify_dinov3
        run: |
          python -m pip install onnx==1.23.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/setup-models.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/setup-dinov3.py
      - name: Test real DINOv3 CPU embeddings
        if: github.event_name == 'workflow_dispatch' && inputs.verify_dinov3
        run: cargo +stable-x86_64-pc-windows-msvc test -p iris-core --lib vision::dinov3::tests::real_dinov3_cpu_embedding -- --exact --ignored --nocapture
      - name: Verify optional DINOv3 offline package closure
        if: github.event_name == 'workflow_dispatch' && inputs.verify_dinov3
        run: python tools/package-dinov3.py --output artifacts/ci-dinov3-offline
      - name: Retain HEIC build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heic-build-diagnostics
          path: |
            artifacts/heif-build/*.log
            models/media/manifest.json
            models/raw/manifest.json
            artifacts/public-corpus/native/manifest.json
            artifacts/ci-directml-fallback/report.json
          if-no-files-found: warn
  application:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json
      - run: npm ci
        working-directory: apps/shell
      - run: npm run check
        working-directory: apps/shell
      - run: npm test
        working-directory: apps/shell
      - run: npm run build
        working-directory: apps/shell
