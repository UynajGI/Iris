name: Dependabot auto-merge
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
permissions: {}
concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      security-events: read
    steps:
      # workflow_run loads trusted default-branch code, never the PR head or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.26'
      - name: Merge eligible dependency updates after complete CI
        run: uv run --locked --default-index https://pypi.org/simple python tools/dependabot-automerge.py
        env:
          GH_TOKEN: ${{ github.token }}
