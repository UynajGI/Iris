name: Traditional render engine
on:
  pull_request:
  push:
    branches: ['main', 'codex/color-workflow']
  workflow_dispatch:
    inputs:
      review_daemon:
        description: 'Build an optimized Windows daemon for local frontend response measurements'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-daemon:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_daemon }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: optimized-review-daemon
      - name: Build optimized review daemon without an installer or release
        run: cargo build --locked --release -p iris-daemon
      - name: Retain optimized daemon for frontend response measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optimized-daemon-windows-x64
          path: target/release/iris-daemon.exe
          if-no-files-found: error
          retention-days: 7
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: CPU contracts without a GPU dependency
        run: cargo test --locked -p iris-render --no-default-features --no-fail-fast
      - name: Default backend and shader validation
        run: cargo test --locked -p iris-render --no-fail-fast
      - name: Install software Vulkan for actual GPU dispatch tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers libvulkan1
      - name: Execute GPU numeric tests on software Vulkan
        if: runner.os == 'Linux'
        env:
          XDG_RUNTIME_DIR: /tmp
        run: cargo test --locked -p iris-render --test gpu -- --ignored --nocapture
  backend-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers libvulkan1
      - name: Exercise actual backend GPU previews and concurrent exports
        run: cargo test --locked -p iris-daemon --test render_performance -- --ignored --nocapture --test-threads=1
      - name: Check large synthetic frames and cancellation within managed budget
        if: ${{ !cancelled() }}
        env:
          IRIS_LARGE_MEMORY_SMOKE: '1'
        run: cargo test --locked -p iris-render --test performance -- --ignored --nocapture --test-threads=1
