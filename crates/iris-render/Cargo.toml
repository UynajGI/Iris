[package]
name = "iris-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Non-destructive, high precision photographic rendering for Iris"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
sha2 = "0.10"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
lcms2 = { version = "6.2", features = ["static"] }
tiff = "0.11.3"
wgpu = { version = "26", default-features = false, features = [
  "std",
  "dx12",
  "metal",
  "vulkan",
  "wgsl"
], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
naga = { version = "26", features = ["wgsl-in"] }
