[workspace]
members = ["crates/iris-core", "crates/iris-daemon", "crates/iris-cli", "crates/iris-mcp"]
exclude = ["components/raw-decoder"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Isolated portable compiler experiment; the default release profile is unchanged.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 1
