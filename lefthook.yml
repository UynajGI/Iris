lefthook: node node_modules/lefthook/bin/index.js

pre-commit:
  commands:
    staged-source:
      run: make staged-check
    staged-quality:
      run: make quality-staged

pre-push:
  commands:
    shared-gates:
      run: make pre-push

commit-msg:
  commands:
    conventional-commit:
      run: node node_modules/@commitlint/cli/cli.js --edit "{1}"
