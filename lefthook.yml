lefthook: node node_modules/lefthook/bin/index.js

pre-commit:
  piped: true
  commands:
    staged-safety:
      priority: 1
      run: make staged-safety
    format:
      priority: 2
      run: make commit-check
      stage_fixed: true

pre-push:
  commands:
    shared-gates:
      run: make pre-push

commit-msg:
  commands:
    conventional-commit:
      run: node node_modules/@commitlint/cli/cli.js --edit "{1}"
