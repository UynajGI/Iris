[project]
name = "iris-maintenance"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]

[dependency-groups]
dev = ["ruff==0.17.0", "lizard==1.24.1", "PyYAML==6.0.3", "pip-audit==2.10.1"]
